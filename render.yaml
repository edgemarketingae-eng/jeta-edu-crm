services:
  - type: web
    name: jeta-edu-crm
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DB_PATH
        value: /var/data/jeta-crm.db
      - key: SEED_DEMO
        value: "true"
      - key: WEBHOOK_KEY
        generateValue: true
    disk:
      name: crm-data
      mountPath: /var/data
      sizeGB: 1
