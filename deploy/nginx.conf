# /etc/nginx/sites-available/jeta-crm   (then: ln -s ../sites-available/jeta-crm /etc/nginx/sites-enabled/)
# Replace crm.yourdomain.com. Run certbot afterwards to add HTTPS:  certbot --nginx -d crm.yourdomain.com
server {
    listen 80;
    server_name crm.yourdomain.com;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Once HTTPS works, certbot adds the 443 block. Then add inside it:
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
